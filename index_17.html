<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-สารบรรณโรงเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d2342;
  --navy-mid:#163457;
  --navy-light:#1e4a7a;
  --gold:#c9a84c;
  --gold-light:#e2c06a;
  --gold-pale:#fdf6e3;
  --white:#ffffff;
  --gray-50:#f8fafc;
  --gray-100:#f1f5f9;
  --gray-200:#e2e8f0;
  --gray-300:#cbd5e1;
  --gray-400:#94a3b8;
  --gray-500:#64748b;
  --text-1:#1e293b;
  --text-2:#475569;
  --text-3:#94a3b8;
  --blue:#2563eb;
  --blue-bg:#eff6ff;
  --green:#16a34a;
  --green-bg:#f0fdf4;
  --orange:#ea580c;
  --orange-bg:#fff7ed;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --amber:#d97706;
  --amber-bg:#fffbeb;
  --purple:#7c3aed;
  --purple-bg:#f5f3ff;
  --sidebar-w:260px;
  --topbar-h:64px;
  --radius:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow:0 4px 16px rgba(0,0,0,.10);
  --shadow-lg:0 8px 32px rgba(0,0,0,.14);
}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:'Sarabun',sans-serif;background:var(--gray-50);color:var(--text-1);min-height:100vh;line-height:1.6}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:99px}

/* ===== LOADING ===== */
#loading-screen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9999;transition:opacity .5s}
#loading-screen.hide{opacity:0;pointer-events:none}
.loading-logo{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--navy);animation:pulse 1.5s ease-in-out infinite}
.loading-text{color:var(--white);font-family:'Prompt',sans-serif;font-size:15px;font-weight:500;opacity:.85}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(201,168,76,.4)}50%{transform:scale(1.05);box-shadow:0 0 0 12px rgba(201,168,76,0)}}

/* ===== LAYOUT ===== */
html,body{height:100%}
#app{min-height:100vh;display:flex;flex-direction:column}
.layout{display:flex;flex:1;min-height:100vh}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--sidebar-w);background:var(--navy);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:200;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sidebar-brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--navy);margin-bottom:10px}
.sidebar-brand-name{font-family:'Prompt',sans-serif;font-size:14px;font-weight:700;color:var(--white);line-height:1.3}
.sidebar-brand-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px;line-height:1.4}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
.sidebar-section{padding:8px 20px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:.08em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:rgba(255,255,255,.65);border-radius:0;transition:all .2s;font-size:13.5px;position:relative;margin:1px 8px;border-radius:8px}
.nav-item:hover{background:rgba(255,255,255,.07);color:var(--white)}
.nav-item.active{background:linear-gradient(90deg,rgba(201,168,76,.2),rgba(201,168,76,.08));color:var(--gold-light);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--gold);border-radius:0 3px 3px 0;margin-left:-8px}
.nav-icon{width:18px;text-align:center;font-size:14px}
.sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.sidebar-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--navy);flex-shrink:0}
.sidebar-user-name{font-size:12.5px;font-weight:600;color:var(--white);line-height:1.2}
.sidebar-user-role{font-size:11px;color:rgba(255,255,255,.4)}
.btn-logout{margin-left:auto;background:rgba(255,255,255,.07);border:none;color:rgba(255,255,255,.5);width:28px;height:28px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s}
.btn-logout:hover{background:rgba(220,38,38,.3);color:var(--white)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190}
.sidebar-overlay.show{display:block}

/* ===== TOPBAR ===== */
.main-content{margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh;flex:1}
.topbar{height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);flex-shrink:0}
.btn-menu{display:none;background:none;border:none;font-size:18px;color:var(--text-2);cursor:pointer;padding:6px;border-radius:8px}
.topbar-title{font-family:'Prompt',sans-serif;font-size:16px;font-weight:700;color:var(--navy);line-height:1.2}
.topbar-sub{font-size:12px;color:var(--text-3);margin-top:1px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn-icon{width:36px;height:36px;border-radius:8px;background:var(--gray-100);border:none;cursor:pointer;color:var(--text-2);font-size:15px;transition:all .2s;display:flex;align-items:center;justify-content:center;position:relative}
.btn-icon:hover{background:var(--gray-200);color:var(--text-1)}
.notif-badge{position:absolute;top:-3px;right:-3px;width:16px;height:16px;background:var(--red);border-radius:50%;font-size:9px;color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700}
.page-content{padding:24px;flex:1;background:var(--gray-50)}

/* ===== WELCOME BANNER ===== */
.welcome-banner{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);border-radius:var(--radius-lg);padding:24px 28px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:relative;overflow:hidden}
.welcome-banner::before{content:'';position:absolute;right:-20px;top:-20px;width:180px;height:180px;border-radius:50%;background:rgba(201,168,76,.08);pointer-events:none}
.welcome-banner::after{content:'⚙';position:absolute;right:60px;bottom:-10px;font-size:80px;opacity:.04;pointer-events:none}
.welcome-banner h2{font-family:'Prompt',sans-serif;font-size:20px;font-weight:700;color:var(--white);margin-bottom:4px}
.welcome-banner h2 span{color:var(--gold-light)}
.welcome-banner p{font-size:13px;color:rgba(255,255,255,.6)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:13.5px;font-weight:600;transition:all .2s;white-space:nowrap}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--blue);color:var(--white)}
.btn-primary:hover:not(:disabled){background:#1d4ed8;transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover:not(:disabled){background:var(--gold-light);transform:translateY(-1px)}
.btn-success{background:var(--green);color:var(--white)}
.btn-success:hover:not(:disabled){background:#15803d}
.btn-danger{background:var(--red);color:var(--white)}
.btn-danger:hover:not(:disabled){background:#b91c1c}
.btn-outline{background:transparent;border:1.5px solid var(--gray-300);color:var(--text-2)}
.btn-outline:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
.btn-sm{padding:5px 10px;font-size:12px}

/* ===== CARDS ===== */
.card{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--gray-100);overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--gray-100)}
.card-title{font-family:'Prompt',sans-serif;font-size:14px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.card-body{padding:20px}

/* ===== STAT GRID ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:var(--radius-lg);padding:18px 20px;border:1px solid var(--gray-100);display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card.highlight{border-left:4px solid var(--gold)}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat-icon.blue{background:var(--blue-bg);color:var(--blue)}
.stat-icon.green{background:var(--green-bg);color:var(--green)}
.stat-icon.orange{background:var(--orange-bg);color:var(--orange)}
.stat-icon.amber{background:var(--amber-bg);color:var(--amber)}
.stat-icon.purple{background:var(--purple-bg);color:var(--purple)}
.stat-value{font-family:'Prompt',sans-serif;font-size:26px;font-weight:800;color:var(--navy);line-height:1}
.stat-label{font-size:12px;color:var(--text-3);margin-top:3px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi-item{border-radius:10px;padding:12px;text-align:center}
.kpi-item.orange{background:var(--orange-bg)}
.kpi-item.green{background:var(--green-bg)}
.kpi-item.amber{background:var(--amber-bg)}
.kpi-item.blue{background:var(--blue-bg)}
.kpi-icon{font-size:20px;margin-bottom:4px}
.kpi-value{font-family:'Prompt',sans-serif;font-size:22px;font-weight:800;color:var(--navy)}
.kpi-label{font-size:11px;color:var(--text-3);margin-top:2px}
.progress-bar-wrap{height:6px;background:var(--gray-100);border-radius:99px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:99px;transition:width .6s ease}
.activity-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.activity-text{font-size:13px;color:var(--text-2)}
.activity-time{font-size:11px;color:var(--text-3);margin-top:2px}

/* ===== TABLE ===== */
.table-wrap{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--gray-100);overflow:hidden}
.table-toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--gray-100);flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:200px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px}
.search-box input{width:100%;padding:8px 12px 8px 32px;border:1.5px solid var(--gray-200);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:13px;outline:none;transition:border .2s;background:var(--gray-50)}
.search-box input:focus{border-color:var(--navy);background:var(--white)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--gray-50);padding:10px 12px;text-align:left;font-weight:700;color:var(--text-2);border-bottom:2px solid var(--gray-200);white-space:nowrap;font-size:12px;letter-spacing:.02em}
tbody tr{border-bottom:1px solid var(--gray-100);transition:background .15s}
tbody tr:hover{background:var(--gray-50)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:10px 12px;color:var(--text-1);vertical-align:middle}
.btn-icon-act{width:28px;height:28px;border-radius:6px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s}
.btn-icon-act.blue{background:var(--blue-bg);color:var(--blue)}
.btn-icon-act.blue:hover{background:var(--blue);color:var(--white)}
.btn-icon-act.green{background:var(--green-bg);color:var(--green)}
.btn-icon-act.green:hover{background:var(--green);color:var(--white)}
.btn-icon-act.red{background:var(--red-bg);color:var(--red)}
.btn-icon-act.red:hover{background:var(--red);color:var(--white)}
.btn-icon-act.tg{background:#e8f4fd;color:#229ED9}
.btn-icon-act.tg:hover{background:#229ED9;color:var(--white)}
.pagination{display:flex;align-items:center;gap:4px;padding:12px 16px;border-top:1px solid var(--gray-100);flex-wrap:wrap}
.page-btn{min-width:32px;height:32px;border-radius:6px;border:1.5px solid var(--gray-200);background:var(--white);cursor:pointer;font-family:'Sarabun',sans-serif;font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;transition:all .15s;padding:0 8px}
.page-btn:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
.page-btn.active{background:var(--navy);color:var(--white);border-color:var(--navy)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font-size:12px;color:var(--text-3);margin-left:auto}

/* ===== BADGES ===== */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;gap:3px}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-orange{background:var(--orange-bg);color:var(--orange)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-gray{background:var(--gray-100);color:var(--gray-500)}
.badge-navy{background:rgba(13,35,66,.1);color:var(--navy)}
.badge-purple{background:var(--purple-bg);color:var(--purple)}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slideUp .25s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--gray-100)}
.modal-icon{width:36px;height:36px;border-radius:10px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:15px}
.modal-title{font-family:'Prompt',sans-serif;font-size:15px;font-weight:700;color:var(--navy);flex:1}
.modal-close{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:16px;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:var(--gray-100);color:var(--text-1)}
.modal-body{overflow-y:auto;padding:20px;flex:1}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--gray-100)}

/* ===== FORM ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.form-control{padding:9px 12px;border:1.5px solid var(--gray-200);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:13.5px;outline:none;transition:border .2s;color:var(--text-1);background:var(--white)}
.form-control:focus{border-color:var(--navy)}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:80px}
.form-control:disabled{background:var(--gray-50);color:var(--text-3);cursor:not-allowed}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.alert-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(220,38,38,.2)}
.alert-success{background:var(--green-bg);color:var(--green);border:1px solid rgba(22,163,74,.2)}

/* ===== FILE UPLOAD ===== */
.file-drop{border:2px dashed var(--gray-300);border-radius:10px;padding:20px;text-align:center;cursor:pointer;color:var(--text-3);font-size:13px;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.file-drop:hover{border-color:var(--navy);color:var(--navy);background:var(--gray-50)}
.file-drop i{font-size:22px;color:var(--gold)}
.file-preview{display:flex;align-items:center;gap:8px;background:var(--blue-bg);padding:8px 12px;border-radius:8px;margin-top:8px}
.file-icon{color:var(--blue);font-size:16px}
.file-name{font-size:12px;flex:1;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-remove{background:none;border:none;color:var(--red);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:12px}

/* ===== TOAST ===== */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--white);border-radius:10px;padding:12px 16px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:13px;min-width:240px;max-width:340px;border-left:4px solid var(--blue);animation:toastIn .3s cubic-bezier(.4,0,.2,1)}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast.info{border-left-color:var(--gold)}
.toast-icon{font-size:16px}
.toast.success .toast-icon{color:var(--green)}
.toast.error .toast-icon{color:var(--red)}
.toast.info .toast-icon{color:var(--gold)}
@keyframes toastIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== SPINNER ===== */
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:var(--white);border-radius:50%;animation:spin .7s linear infinite}
.spinner.dark{border:2.5px solid var(--gray-200);border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:48px 20px}
.empty-state i{font-size:48px;color:var(--gray-300);display:block;margin-bottom:14px}
.empty-state h4{font-family:'Prompt',sans-serif;font-size:16px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.empty-state p{font-size:13px;color:var(--text-3);margin-bottom:16px}

/* ===== LOGIN ===== */
.login-page{min-height:100vh;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 40%,#0f3460 100%);display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.login-page::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:rgba(201,168,76,.06);pointer-events:none}
.login-page::after{content:'';position:absolute;bottom:-150px;left:-100px;width:500px;height:500px;border-radius:50%;background:rgba(201,168,76,.04);pointer-events:none}
.login-card{background:var(--white);border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.3);position:relative;z-index:1}
.login-logo-wrap{text-align:center;margin-bottom:28px}
.login-logo-circle{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy-light));display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--gold);margin:0 auto 14px}
.login-title{font-family:'Prompt',sans-serif;font-size:17px;font-weight:800;color:var(--navy)}
.login-school{font-size:12.5px;color:var(--text-3);margin-top:4px}
.login-divider{height:1px;background:var(--gray-100);margin:4px 0 20px}
.login-page .form-control{padding:11px 12px 11px 38px}
.input-wrap{position:relative}
.input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px;pointer-events:none}
.btn-login{width:100%;padding:12px;background:linear-gradient(90deg,var(--navy),var(--navy-light));color:var(--white);border:none;border-radius:10px;font-family:'Prompt',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.btn-login:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(13,35,66,.4)}
.btn-login:disabled{opacity:.7;cursor:not-allowed}
.login-help{font-size:11.5px;color:var(--text-3);text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--gray-100)}
.login-help code{background:var(--gray-100);padding:1px 6px;border-radius:4px;font-family:monospace;color:var(--text-2)}

/* ===== TABS ===== */
.tabs{display:flex;gap:4px;padding:4px;background:var(--gray-100);border-radius:10px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text-3);transition:all .2s;font-weight:500}
.tab.active{background:var(--white);color:var(--navy);font-weight:700;box-shadow:var(--shadow-sm)}
.tab:hover:not(.active){color:var(--text-2)}

/* ===== FADE ===== */
.fade-in{animation:fadeInUp .3s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== CONFIRM DIALOG ===== */
.confirm-box{text-align:center;padding:12px 0}
.confirm-emoji{font-size:40px;margin-bottom:12px}
.confirm-title{font-family:'Prompt',sans-serif;font-size:16px;font-weight:700;color:var(--navy);margin-bottom:6px}
.confirm-msg{font-size:13px;color:var(--text-3)}

/* ===== NOTIF PANEL ===== */
.notif-panel{position:fixed;top:72px;right:16px;width:320px;background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);border:1px solid var(--gray-100);z-index:300;overflow:hidden;animation:slideUp .2s}
.notif-panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--gray-100);background:var(--gray-50)}
.notif-panel-title{font-family:'Prompt',sans-serif;font-size:13px;font-weight:700;color:var(--navy)}
.notif-panel-action{font-size:12px;color:var(--blue);cursor:pointer}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--gray-100);transition:background .15s}
.notif-item:hover{background:var(--gray-50)}
.notif-item.unread{background:var(--blue-bg)}
.notif-text{font-size:13px;color:var(--text-1)}
.notif-time{font-size:11px;color:var(--text-3);margin-top:3px}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main-content{margin-left:0}
  .btn-menu{display:flex}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .dash-grid{grid-template-columns:1fr}
}
@media(max-width:600px){

// GAS BACKEND ADAPTER
// =============================================
// แทนที่ localStorage ด้วย Google Sheets API
// ทุกฟังก์ชันที่ใช้ DB.xxx จะถูก intercept
// =============================================
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbx2Bg_Oj_9ztKMr2iHCjVbTMjWQNaI9HmPDcu2jIFl1iJtlcZtEckpx91AT-2VAB6WZCQ/exec';
// ↑ วาง Web App URL จาก Google Apps Script ที่นี่
// ตัวอย่าง: 'https://script.google.com/macros/s/AKfycbxxx/exec'

// Token management
let _gasToken = localStorage.getItem('sarabun_token') || '';

// Core API call
async function gasCall(action, body = {}) {
  const res = await fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, token: _gasToken, year: String(DB.activeYear), ...body }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// Override dbLoad — load from GAS instead of localStorage
async function dbLoad() {
  const savedYear = localStorage.getItem('sarabun_activeYear');
  if (savedYear) DB.activeYear = parseInt(savedYear);
  // Token from localStorage
  _gasToken = localStorage.getItem('sarabun_token') || '';
}

// Override dbSave — only activeYear saved locally; data goes to GAS
function dbSave(key) {
  if (key === 'activeYear') localStorage.setItem('sarabun_activeYear', DB.activeYear);
  // numberFormats sync to GAS
  if (key === 'numberFormats') {
    gasCall('saveNumFormats', { data: DB.numberFormats }).catch(() => {});
  }
}

// Override genRunningNo — number generated server-side
async function genRunningNo(type) {
  // For create calls, the server generates the number automatically
  // This is a no-op placeholder; actual number comes from API response
  return null;
}
// Sync: peek next number from server (for form placeholders)
async function peekNextNo(type) {
  try {
    const fmts = DB.numberFormats;
    const f    = fmts[type] || NUM_FORMAT_DEFAULTS[type];
    const year = DB.activeYear;
    const seqKey  = `_seq_${year}`;
    const lastSeq = parseInt(f[seqKey]) || 0;
    const start   = parseInt(f.startNumber) || 1;
    const next    = lastSeq === 0 ? start : lastSeq + 1;
    return previewFormat(f, next, year);
  } catch (e) { return ''; }
}

// Override auth
const _origLogin = (u, p) => {};
async function gasLogin(username, password) {
  const res = await gasCall('login', { username, password });
  if (res.success) {
    _gasToken = res.token;
    localStorage.setItem('sarabun_token', res.token);
    localStorage.setItem('sarabun_user', JSON.stringify(res.user));
    DB.users = [res.user]; // minimal user cache
    App.state.user = res.user;
    addLog('login', 'เข้าสู่ระบบ');
    UI.toast('เข้าสู่ระบบสำเร็จ', 'success');
    App.navigate('dashboard');

    document.getElementById('login-error').innerHTML =
      `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${res.error || 'เข้าสู่ระบบไม่สำเร็จ'}</div>`;
  }
}

    if (res.stats) DB._incStats = res.stats;
  }
}

  const res = await gasCall('createIncomingDoc', data);
  if (res.success) { DB.incoming.push({ ...res.data, year: parseInt(res.data.year) || DB.activeYear }); }
  return res;
}

async function gasDeleteIncoming(id)   { return gasCall('deleteIncomingDoc', { id }); }

// ── File upload to Drive ──
async function gasUploadFile(inp) {
  const file = inp.files[0]; if (!file) return null;
  if (file.size > 10 * 1024 * 1024) { UI.toast('ไฟล์ใหญ่เกินไป (สูงสุด 10MB)', 'error'); return null; }
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const base64 = e.target.result.split(',')[1];
        const res    = await gasCall('uploadFile', { fileData: base64, fileName: file.name, mimeType: file.type });
        if (res.success) { UI.toast('อัปโหลดไฟล์สำเร็จ', 'success'); resolve(res.data); }
        else { UI.toast(res.error || 'อัปโหลดไม่สำเร็จ', 'error'); resolve(null); }
      } catch { UI.toast('อัปโหลดไม่สำเร็จ', 'error'); resolve(null); }
    };
    reader.readAsDataURL(file);
  });
}

// ── Wrap _readAttach to upload to Drive ──
async function _readAttachGAS(pfx) {
  const linkPanel = document.getElementById(`${pfx}-attach-link-panel`);
  const isLink    = linkPanel && linkPanel.style.display !== 'none';
  if (isLink) {
    const url  = (document.getElementById(`${pfx}-link-url`)?.value || '').trim();
    let name   = '';
    if (url) { try { const u = new URL(url); name = u.hostname + (u.pathname.length > 1 ? u.pathname : ''); } catch { name = url; } }
    return { fileUrl: url, fileName: name, attachType: 'link' };
  }
  const inp = document.getElementById(`${pfx}-file`);
  if (inp && inp.files && inp.files.length > 0) {
    const up = await gasUploadFile(inp);
    if (up) return { fileUrl: up.viewUrl || '', fileName: up.fileName || '', attachType: 'file' };
  }
  return {
    fileUrl:    document.getElementById(`${pfx}-file-url`)?.value  || '',
    fileName:   document.getElementById(`${pfx}-file-name`)?.value || '',
    attachType: 'file',
  };
}

    const s = localStorage.getItem('sarabun_'+k);
    if(s) try{DB[k]=JSON.parse(s)}catch(e){}
  });
  const savedYear = localStorage.getItem('sarabun_activeYear');
  if(savedYear) DB.activeYear = parseInt(savedYear);
  // ensure all format keys exist (merge defaults)
  ['incoming','outgoing','memos','orders'].forEach(k=>{
    DB.numberFormats[k]={...NUM_FORMAT_DEFAULTS[k],...(DB.numberFormats[k]||{})};
  });
}
function dbSave(key){
  if(key==='activeYear'){ localStorage.setItem('sarabun_activeYear', DB.activeYear); return; }
  localStorage.setItem('sarabun_'+key, JSON.stringify(DB[key]));
}

// Helper: get all available years from a collection
function getYears(collection){ return [...new Set(collection.map(d=>d.year).filter(Boolean))].sort((a,b)=>b-a); }
// Helper: get active year display string
function activeYearLabel(){ return `พ.ศ. ${DB.activeYear}`; }

// Build doc number from format settings — counter is per year
function genRunningNo(type){
  const f = DB.numberFormats[type];
  if(!f||!f.enabled) return null;
  const year = DB.activeYear;
  const seqKey = `_seq_${year}`;          // e.g. _seq_2569
  const lastSeq = parseInt(f[seqKey])||0;
  const start   = parseInt(f.startNumber)||1;
  const nextSeq = lastSeq === 0 ? start : lastSeq + 1;
  f[seqKey] = nextSeq;
  dbSave('numberFormats');
  const pad = parseInt(f.padding);
  const num = pad === 1 ? String(nextSeq) : String(nextSeq).padStart(pad||3,'0');
  return _buildNo(f, num, year);
}
function previewFormat(f, sampleSeq=1, forYear){
  if(!f) return '';
  const pad = parseInt(f.padding);
  const num = pad === 1 ? String(sampleSeq) : String(sampleSeq).padStart(pad||3,'0');
  return _buildNo(f, num, forYear||DB.activeYear);
}
function _buildNo(f, num, forYear){
  const year = forYear || DB.activeYear;
  let displayYear = year;
  if(f.yearType==='ad') displayYear = year - 543;
  if(!f.yearFull) displayYear = String(displayYear).slice(-2);
  const mo = String(new Date().getMonth()+1).padStart(2,'0');
  let result = `${f.prefix||''}${num}${f.suffix||''}`;
  if(f.includeYear){
    result += f.separator||'/';
    if(f.includeMonth) result += `${mo}/`;
    result += displayYear;
  }
  return result;
}
// Extract numeric sequence from a doc number string for sorting
function extractSeq(no){
  if(!no) return 0;
  const m = no.match(/(\d+)/);
  return m ? parseInt(m[1]) : 0;
}
// Get preview of next number without consuming counter
function peekNextNo(type){
  const f = DB.numberFormats[type]; if(!f||!f.enabled) return '';
  const year = DB.activeYear;
  const seqKey = `_seq_${year}`;
  const lastSeq = parseInt(f[seqKey])||0;
  const start = parseInt(f.startNumber)||1;
  const nextSeq = lastSeq===0 ? start : lastSeq+1;
  return previewFormat(f, nextSeq, year);
}
function genId(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,6); }
function nowDate(){
  const d = new Date();
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yy=d.getFullYear()+543;
  const hh=String(d.getHours()).padStart(2,'0');
  const min=String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yy} ${hh}:${min}`;
}
function addLog(action, detail){
  DB.logs.unshift({id:genId(),user_name:App.state.user?.fullname||'',action,detail,created_at:nowDate()});
  if(DB.logs.length>200) DB.logs=DB.logs.slice(0,200);
  dbSave('logs');
}

    const y=DB.activeYear;
    const inc=DB.incoming.filter(d=>d.year===y), out=DB.outgoing.filter(d=>d.year===y), mem=DB.memos.filter(d=>d.year===y);
    const stats={
      inc:{total:inc.length,pending:inc.filter(d=>d.status==='รอดำเนินการ').length,done:inc.filter(d=>d.status==='ดำเนินการแล้ว').length},
      out:{total:out.length,waitSign:out.filter(d=>d.status==='รอลงนาม').length,sent:out.filter(d=>d.status==='ส่งแล้ว').length,draft:out.filter(d=>d.status==='ร่าง').length},
      mem:{total:mem.length,wait:mem.filter(d=>d.status==='รออนุมัติ').length},
    };
    App.renderLayout('Dashboard','ภาพรวมระบบสารบรรณ',`
      <div class="welcome-banner">
        <div>
          <h2>สวัสดี, <span>${App.state.user.fullname}</span> 👋</h2>
          <p>ระบบ e-สารบรรณ | <strong>ปี พ.ศ. ${DB.activeYear}</strong> | ${App.config.schoolName}</p>
        </div>
        <div class="btn-group">
          <button class="btn btn-gold" onclick="App.navigate('incoming')"><i class="fas fa-inbox"></i> หนังสือรับ</button>
          <button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="App.navigate('outgoing')"><i class="fas fa-paper-plane"></i> หนังสือส่ง</button>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-card highlight" onclick="App.navigate('incoming')" style="cursor:pointer">
          <div class="stat-icon blue"><i class="fas fa-inbox"></i></div>
          <div><div class="stat-value">${stats.inc.total}</div><div class="stat-label">หนังสือรับทั้งหมด</div></div>
        </div>
        <div class="stat-card" onclick="App.navigate('incoming')" style="cursor:pointer">
          <div class="stat-icon orange"><i class="fas fa-clock"></i></div>
          <div><div class="stat-value">${stats.inc.pending}</div><div class="stat-label">รอดำเนินการ</div></div>
        </div>
        <div class="stat-card" onclick="App.navigate('outgoing')" style="cursor:pointer">
          <div class="stat-icon green"><i class="fas fa-paper-plane"></i></div>
          <div><div class="stat-value">${stats.out.total}</div><div class="stat-label">หนังสือส่งทั้งหมด</div></div>
        </div>
        <div class="stat-card" onclick="App.navigate('memos')" style="cursor:pointer">
          <div class="stat-icon amber"><i class="fas fa-sticky-note"></i></div>
          <div><div class="stat-value">${stats.mem.total}</div><div class="stat-label">บันทึกข้อความ</div></div>
        </div>
      </div>

      <div class="dash-grid">
        <div class="card">
          <div class="card-header">
            <div class="card-title"><i class="fas fa-inbox" style="color:var(--blue)"></i> หนังสือรับ</div>
            <button class="btn btn-sm btn-outline" onclick="App.navigate('incoming')">ดูทั้งหมด</button>
          </div>
          <div class="card-body">
            <div class="kpi-grid">
              <div class="kpi-item orange"><div class="kpi-icon">⏳</div><div class="kpi-value">${stats.inc.pending}</div><div class="kpi-label">รอดำเนินการ</div></div>
              <div class="kpi-item green"><div class="kpi-icon">✅</div><div class="kpi-value">${stats.inc.done}</div><div class="kpi-label">ดำเนินการแล้ว</div></div>
            </div>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${stats.inc.total>0?Math.round(stats.inc.done/stats.inc.total*100):0}%;background:var(--green)"></div></div>
            <div style="text-align:right;font-size:11px;color:var(--text-3);margin-top:4px">${stats.inc.total>0?Math.round(stats.inc.done/stats.inc.total*100):0}% เสร็จสิ้น</div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <div class="card-title"><i class="fas fa-paper-plane" style="color:var(--green)"></i> หนังสือส่ง</div>
            <button class="btn btn-sm btn-outline" onclick="App.navigate('outgoing')">ดูทั้งหมด</button>
          </div>
          <div class="card-body">
            <div class="kpi-grid">
              <div class="kpi-item amber"><div class="kpi-icon">✍️</div><div class="kpi-value">${stats.out.waitSign}</div><div class="kpi-label">รอลงนาม</div></div>
              <div class="kpi-item green"><div class="kpi-icon">📨</div><div class="kpi-value">${stats.out.sent}</div><div class="kpi-label">ส่งแล้ว</div></div>
            </div>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${stats.out.total>0?Math.round(stats.out.sent/stats.out.total*100):0}%;background:var(--blue)"></div></div>
            <div style="text-align:right;font-size:11px;color:var(--text-3);margin-top:4px">${stats.out.total>0?Math.round(stats.out.sent/stats.out.total*100):0}% ส่งแล้ว</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-history" style="color:var(--orange)"></i> กิจกรรมล่าสุด</div>
        </div>
        <div class="card-body">
          ${DB.logs.slice(0,6).map(l=>`
            <div class="activity-item">
              <div class="activity-dot" style="background:${l.action.includes('create')?'var(--green)':l.action.includes('delete')?'var(--red)':'var(--blue)'}"></div>
              <div><div class="activity-text">${l.detail}</div><div class="activity-time">${l.created_at} — ${l.user_name}</div></div>
            </div>`).join('')}
        </div>
      </div>
    `);
  },

  // ===== INCOMING =====
  _incSearch:'', _incPage:1, _incMyTask:false,
  renderIncoming(){
    App._incSearch=''; App._incPage=1; App._incMyTask=false;
    App.renderLayout('หนังสือรับ','ทะเบียนหนังสือรับเข้า',`
      <div id="inc-stats"></div>
      <div class="table-wrap">
        <div class="table-toolbar" style="gap:8px;flex-wrap:wrap">
          <div class="search-box" style="min-width:180px;flex:1">
            <i class="fas fa-search search-icon"></i>
            <input type="text" placeholder="ค้นหาเลขรับ, เรื่อง, หน่วยงาน..." oninput="App._incSearch=this.value;App._incPage=1;App._renderIncTable()">
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-left:auto">
            <button class="btn btn-outline" id="btn-mytask" onclick="App._toggleMyTask()" title="กรองเฉพาะงานที่รับผิดชอบ">
              <i class="fas fa-user-check"></i> <span class="hide-xs">เฉพาะงานที่รับผิดชอบ</span>
            </button>
            <button class="btn btn-outline" onclick="App._showReserveForm()" title="จองเลขรับล่วงหน้า">
              <i class="fas fa-bookmark"></i> <span class="hide-xs">จองเลขรับ</span>
            </button>
            <button class="btn btn-primary" onclick="App._showIncForm()">
              <i class="fas fa-plus"></i> ลงทะเบียนหนังสือรับ
            </button>
          </div>
        </div>
        <div id="inc-table"></div>
      </div>`);
    App._renderIncStats();
    App._renderIncTable();
  },
  _toggleMyTask(){
    App._incMyTask=!App._incMyTask;
    App._incPage=1;
    const btn=document.getElementById('btn-mytask');
    if(btn){
      btn.style.background=App._incMyTask?'var(--navy)':'';
      btn.style.color=App._incMyTask?'var(--white)':'';
      btn.style.borderColor=App._incMyTask?'var(--navy)':'';
    }
    App._renderIncTable();
  },
  _renderIncStats(){
    const d=DB.incoming.filter(x=>x.year===DB.activeYear);
    document.getElementById('inc-stats').innerHTML=`
      <div class="stat-grid" style="margin-bottom:16px">
        <div class="stat-card highlight"><div class="stat-icon blue"><i class="fas fa-inbox"></i></div><div><div class="stat-value">${d.length}</div><div class="stat-label">ทั้งหมด (${DB.activeYear})</div></div></div>
        <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-clock"></i></div><div><div class="stat-value">${d.filter(x=>x.status==='รอดำเนินการ').length}</div><div class="stat-label">รอดำเนินการ</div></div></div>
        <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check"></i></div><div><div class="stat-value">${d.filter(x=>x.status==='ดำเนินการแล้ว').length}</div><div class="stat-label">เสร็จสิ้น</div></div></div>
        <div class="stat-card"><div class="stat-icon amber"><i class="fas fa-share"></i></div><div><div class="stat-value">${d.filter(x=>x.status==='ส่งต่อแล้ว').length}</div><div class="stat-label">ส่งต่อแล้ว</div></div></div>
      </div>`;
  },
  _renderIncTable(){
    const q=App._incSearch.toLowerCase();
    const me=App.state.user.fullname;
    let all=DB.incoming.filter(d=>d.year===DB.activeYear&&(!q||d.receive_no.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||(d.department||'').toLowerCase().includes(q)||(d.responsible||'').toLowerCase().includes(q)));
    if(App._incMyTask) all=all.filter(d=>(d.responsible||'').includes(me));
    // Sort: latest (highest seq) first
    all=[...all].sort((a,b)=>extractSeq(b.receive_no)-extractSeq(a.receive_no));
    const pp=12, page=App._incPage, total=Math.ceil(all.length/pp)||1;
    const rows=all.slice((page-1)*pp, page*pp);
    const isAdmin=['admin','director'].includes(App.state.user.role);
    // file/link cell helper
    const fileCell=d=>{
      if(d.file_url&&d.file_url.startsWith('http')) return `<a href="${d.file_url}" target="_blank" rel="noopener" class="btn-icon-act blue" title="${d.file_name||'ดูไฟล์/ลิงก์'}"><i class="fas fa-${d.attach_type==='link'?'link':'file-alt'}"></i></a>`;
      return `<span style="color:var(--gray-300);font-size:13px">—</span>`;
    };
    document.getElementById('inc-table').innerHTML = all.length===0
      ? UI.emptyState('fa-inbox','ไม่มีหนังสือรับ',q?'ไม่พบผลการค้นหา':(App._incMyTask?'ไม่มีงานที่คุณรับผิดชอบ':'ยังไม่มีหนังสือรับ'),'ลงทะเบียนหนังสือรับ','App._showIncForm()')
      : `<div style="overflow-x:auto"><table>
          <thead><tr><th>#</th><th>เลขรับ</th><th>เลขหนังสือ</th><th>วันที่รับ</th><th>เรื่อง</th><th>จาก</th><th>ผู้รับผิดชอบ</th><th>ชั้นความเร็ว</th><th>สถานะ</th><th style="text-align:center">ไฟล์/ลิงก์</th><th>จัดการ</th></tr></thead>
          <tbody>${rows.map((d,i)=>`<tr>
            <td>${(page-1)*pp+i+1}</td>
            <td><strong style="color:var(--navy)">${d.receive_no}${d.reserved?'<span class="badge badge-amber" style="margin-left:4px;font-size:9px">จอง</span>':''}</strong></td>
            <td style="font-size:12px">${d.book_no||'-'}</td>
            <td style="white-space:nowrap;font-size:12px">${d.date_received}</td>
            <td style="max-width:220px;font-size:13px">${d.title}</td>
            <td style="font-size:12px">${d.department||'-'}</td>
            <td style="font-size:12px">${d.responsible||'-'}</td>
            <td>${UI.urgentBadge(d.urgent)}</td>
            <td>${UI.statusBadge(d.status)}</td>
            <td style="text-align:center">${fileCell(d)}</td>
            <td><div style="display:flex;gap:4px">
              <button class="btn-icon-act blue" title="แก้ไข" onclick="App._showIncForm('${d.id}')"><i class="fas fa-edit"></i></button>
              <button class="btn-icon-act green" title="เปลี่ยนสถานะ" onclick="App._changeIncStatus('${d.id}')"><i class="fas fa-exchange-alt"></i></button>
              <button class="btn-icon-act tg" title="แจ้งเตือน Telegram" onclick="App._manualNotify('incoming','${d.id}')"><i class="fab fa-telegram-plane"></i></button>
              ${isAdmin?`<button class="btn-icon-act red" title="ลบ" onclick="App._deleteInc('${d.id}')"><i class="fas fa-trash"></i></button>`:''}
            </div></td>
          </tr>`).join('')}</tbody>
        </table></div>
        <div class="pagination">
          <button class="page-btn" ${page<=1?'disabled':''} onclick="App._incPage--;App._renderIncTable()"><i class="fas fa-chevron-left"></i></button>
          ${Array.from({length:Math.min(total,7)},(_,i)=>`<button class="page-btn ${i+1===page?'active':''}" onclick="App._incPage=${i+1};App._renderIncTable()">${i+1}</button>`).join('')}
          <button class="page-btn" ${page>=total?'disabled':''} onclick="App._incPage++;App._renderIncTable()"><i class="fas fa-chevron-right"></i></button>
          <span class="page-info">แสดง ${Math.min((page-1)*pp+1,all.length)}-${Math.min(page*pp,all.length)} จาก ${all.length} ${App._incMyTask?'(กรองแล้ว)':''}</span>
        </div>`;
  },
  _showIncForm(id){
    const doc=id?DB.incoming.find(d=>d.id===id):null;
    const isEdit=!!doc;
    const attachType=doc?.attach_type||'file';
    UI.showModal(isEdit?'แก้ไขหนังสือรับ':'ลงทะเบียนหนังสือรับ',`
      <div class="form-grid">
        ${isEdit?`<div class="form-group"><label class="form-label">เลขรับ</label><input class="form-control" value="${doc.receive_no}" disabled></div>`:''}
        <div class="form-group"><label class="form-label">เลขที่หนังสือ</label><input class="form-control" id="f-bno" value="${doc?.book_no||''}" placeholder="เช่น ศธ 04001/1234"></div>
        <div class="form-group"><label class="form-label">วันที่รับ</label><input type="date" class="form-control" id="f-drc" value="${new Date().toISOString().split('T')[0]}"></div>
        <div class="form-group full"><label class="form-label">เรื่อง <span style="color:var(--red)">*</span></label><input class="form-control" id="f-ttl" value="${doc?.title||''}" placeholder="ระบุเรื่อง"></div>
        <div class="form-group"><label class="form-label">จาก (หน่วยงาน)</label><input class="form-control" id="f-dept" value="${doc?.department||''}" placeholder="หน่วยงานต้นทาง"></div>
        <div class="form-group"><label class="form-label">ผู้รับผิดชอบ</label><input class="form-control" id="f-resp" value="${doc?.responsible||''}" placeholder="ชื่อผู้รับผิดชอบ"></div>
        <div class="form-group"><label class="form-label">ชั้นความเร็ว</label>
          <select class="form-control" id="f-urg">
            <option value="ปกติ" ${doc?.urgent==='ปกติ'?'selected':''}>ปกติ</option>
            <option value="ด่วน" ${doc?.urgent==='ด่วน'?'selected':''}>ด่วน</option>
            <option value="ด่วนที่สุด" ${doc?.urgent==='ด่วนที่สุด'?'selected':''}>ด่วนที่สุด</option>
          </select>
        </div>
        ${isEdit?`<div class="form-group"><label class="form-label">สถานะ</label>
          <select class="form-control" id="f-sta">
            ${['รอดำเนินการ','กำลังดำเนินการ','ดำเนินการแล้ว','ส่งต่อแล้ว'].map(s=>`<option value="${s}" ${doc?.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>`:''}
        <div class="form-group full"><label class="form-label">หมายเหตุ</label><input class="form-control" id="f-note" value="${doc?.note||''}" placeholder="หมายเหตุ"></div>

        <!-- ATTACH SECTION -->
        <div class="form-group full">
          <label class="form-label">เอกสารแนบ</label>
          <div style="display:flex;gap:0;margin-bottom:10px;border:1.5px solid var(--gray-200);border-radius:8px;overflow:hidden">
            <button type="button" id="tab-file" onclick="App._switchAttachTab('file')"
              style="flex:1;padding:8px;border:none;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:600;transition:all .2s;background:${attachType==='file'?'var(--navy)':'var(--white)'};color:${attachType==='file'?'var(--white)':'var(--text-3)'}">
              <i class="fas fa-paperclip"></i> แนบไฟล์
            </button>
            <button type="button" id="tab-link" onclick="App._switchAttachTab('link')"
              style="flex:1;padding:8px;border:none;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:600;transition:all .2s;background:${attachType==='link'?'var(--navy)':'var(--white)'};color:${attachType==='link'?'var(--white)':'var(--text-3)'}">
              <i class="fas fa-link"></i> แนบลิงก์ URL
            </button>
          </div>

          <div id="attach-file-panel" style="display:${attachType==='link'?'none':'block'}">
            <div class="file-drop" onclick="document.getElementById('f-file').click()" id="file-drop-zone">
              <i class="fas fa-cloud-upload-alt" style="font-size:24px;color:var(--gold)"></i>
              <span style="font-size:13px">คลิกเพื่อเลือกไฟล์ หรือลากไฟล์มาวางที่นี่</span>
              <span style="font-size:11px;color:var(--text-3)">รองรับ PDF, DOC, DOCX, JPG, PNG (สูงสุด 10MB)</span>
              <input type="file" id="f-file" style="display:none" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="App._onFileSelected(this)">
            </div>
            <div id="f-file-preview" style="margin-top:8px">
              ${doc?.file_url&&attachType==='file'?`<div class="file-preview"><i class="fas fa-file-alt file-icon"></i><a href="${doc.file_url}" target="_blank" class="file-name" style="color:var(--blue)">${doc.file_name||'ไฟล์แนบ'}</a><button class="file-remove" onclick="App._clearAttach()"><i class="fas fa-times"></i></button></div>`:''}
            </div>
            <input type="hidden" id="f-file-url" value="${doc?.attach_type==='file'?doc?.file_url||'':''}">
            <input type="hidden" id="f-file-name" value="${doc?.attach_type==='file'?doc?.file_name||'':''}">
          </div>

          <div id="attach-link-panel" style="display:${attachType==='link'?'block':'none'}">
            <div style="display:flex;gap:8px;align-items:stretch">
              <div style="position:relative;flex:1">
                <i class="fas fa-link" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px"></i>
                <input class="form-control" id="f-link-url" value="${doc?.attach_type==='link'?doc?.file_url||'':''}"
                  placeholder="https://drive.google.com/... หรือ URL ใดก็ได้"
                  style="padding-left:32px" oninput="App._previewLink(this.value)">
              </div>
              <button type="button" class="btn btn-outline btn-sm" onclick="App._previewLink(document.getElementById('f-link-url').value)" style="white-space:nowrap">
                <i class="fas fa-eye"></i> ดูตัวอย่าง
              </button>
            </div>
            <div id="f-link-preview" style="margin-top:8px">
              ${doc?.attach_type==='link'&&doc?.file_url?`<div class="file-preview"><i class="fas fa-external-link-alt file-icon" style="color:var(--green)"></i><a href="${doc.file_url}" target="_blank" class="file-name" style="color:var(--blue)">${doc.file_name||doc.file_url}</a></div>`:''}
            </div>
            <input type="hidden" id="f-attach-type" value="${attachType}">
          </div>
        </div>
      </div>`,`
      <button class="btn btn-outline" onclick="UI.closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="App._saveInc('${id||''}')"><i class="fas fa-save"></i> ${isEdit?'บันทึก':'ลงทะเบียน'}</button>`,
      isEdit?'fa-edit':'fa-plus-circle');

    // Drag and drop
    setTimeout(()=>{
      const zone=document.getElementById('file-drop-zone');
      if(!zone)return;
      zone.addEventListener('dragover',e=>{e.preventDefault();zone.style.borderColor='var(--navy)';zone.style.background='var(--gray-50)';});
      zone.addEventListener('dragleave',()=>{zone.style.borderColor='';zone.style.background='';});
      zone.addEventListener('drop',e=>{
        e.preventDefault();zone.style.borderColor='';zone.style.background='';
        const f=e.dataTransfer.files[0];
        if(f){const inp=document.getElementById('f-file');const dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;App._onFileSelected(inp);}
      });
    },100);
  },
  _switchAttachTab(type){
    const isFile=type==='file';
    document.getElementById('attach-file-panel').style.display=isFile?'block':'none';
    document.getElementById('attach-link-panel').style.display=isFile?'none':'block';
    document.getElementById('tab-file').style.background=isFile?'var(--navy)':'var(--white)';
    document.getElementById('tab-file').style.color=isFile?'var(--white)':'var(--text-3)';
    document.getElementById('tab-link').style.background=isFile?'var(--white)':'var(--navy)';
    document.getElementById('tab-link').style.color=isFile?'var(--text-3)':'var(--white)';
    const ta=document.getElementById('f-attach-type');
    if(ta) ta.value=type;
  },
  _onFileSelected(inp){
    const f=inp.files[0]; if(!f)return;
    if(f.size>10*1024*1024){UI.toast('ไฟล์ใหญ่เกินไป (สูงสุด 10MB)','error');inp.value='';return;}
    // In a real app this would upload; here we store a blob URL as demo
    const url=URL.createObjectURL(f);
    document.getElementById('f-file-url').value=url;
    document.getElementById('f-file-name').value=f.name;
    document.getElementById('f-file-preview').innerHTML=`
      <div class="file-preview">
        <i class="fas fa-file-alt file-icon"></i>

  _saveReserveGeneric(type, no){
    const d=new Date();
    const dateStr=`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`;
    const dateVal=document.getElementById('f-rv-date').value;
    let displayDate='';
    if(dateVal){const p=dateVal.split('-');displayDate=`${p[2]}/${p[1]}/${parseInt(p[0])+543}`;}
    const title=document.getElementById('f-rv-title').value.trim()||'(จองเลข)';
    const resp=document.getElementById('f-rv-resp').value.trim();
    const note='[จองเลข] '+document.getElementById('f-rv-note').value.trim();

    // Consume the counter so the number is real
    const f=DB.numberFormats[type];
    if(f){
      const seqKey=`_seq_${DB.activeYear}`;
      const lastSeq=parseInt(f[seqKey])||0;
      const start=parseInt(f.startNumber)||1;
      f[seqKey]=lastSeq===0?start:lastSeq+1;
      dbSave('numberFormats');
    }

    if(type==='outgoing'){
      DB.outgoing.push({id:genId(),year:DB.activeYear,send_no:no,reserved:true,date_sent:displayDate||dateStr,title,to_department:'',urgent:'ปกติ',signer:resp,status:'ร่าง',content:note,file_url:''});
      dbSave('outgoing'); addLog('create_outgoing',`จองเลขส่ง ${no}`);
      App._notifyTelegram('reserve',{no,title});
      UI.closeModal(); UI.toast(`จองเลข ${no} สำเร็จ`,'success');
      App._renderOutStats(); App._renderOutTable();
    } else if(type==='memos'){
      DB.memos.push({id:genId(),year:DB.activeYear,memo_no:no,reserved:true,title,to_person:resp,status:'ร่าง',content:note,created_at:displayDate||dateStr,file_url:''});
      dbSave('memos'); addLog('create_memo',`จองเลขบันทึก ${no}`);
      App._notifyTelegram('reserve',{no,title});
      UI.closeModal(); UI.toast(`จองเลข ${no} สำเร็จ`,'success');
      App._renderMemoTable('');
    } else if(type==='orders'){
      DB.orders.push({id:genId(),year:DB.activeYear,order_no:no,reserved:true,title,effective_date:displayDate,status:'ร่าง',content:note});
      dbSave('orders'); addLog('create_order',`จองเลขคำสั่ง ${no}`);
      App._notifyTelegram('reserve',{no,title});
      UI.closeModal(); UI.toast(`จองเลข ${no} สำเร็จ`,'success');
      App._renderOrdersTable('');
    }
  },
  _saveInc(id){
    const title=document.getElementById('f-ttl').value.trim();
    if(!title){UI.toast('กรุณาระบุเรื่อง','error');return;}
    const dateVal=document.getElementById('f-drc').value;
    let displayDate='';
    if(dateVal){const p=dateVal.split('-');displayDate=`${p[2]}/${p[1]}/${parseInt(p[0])+543}`;}

    // Determine attach type
    const linkPanel=document.getElementById('attach-link-panel');
    const attachType=(linkPanel&&linkPanel.style.display!=='none')?'link':'file';
    let fileUrl='', fileName='';
    if(attachType==='link'){
      fileUrl=(document.getElementById('f-link-url')?.value||'').trim();
      if(fileUrl){try{const u=new URL(fileUrl);fileName=u.hostname+(u.pathname.length>1?u.pathname:'');}catch(e){fileName=fileUrl;}}
    } else {
      fileUrl=document.getElementById('f-file-url')?.value||'';
      fileName=document.getElementById('f-file-name')?.value||'';
    }

    if(id){
      const idx=DB.incoming.findIndex(d=>d.id===id);
      if(idx>=0){
        DB.incoming[idx]={...DB.incoming[idx],
          book_no:document.getElementById('f-bno').value.trim(),
          date_received:displayDate||DB.incoming[idx].date_received,
          title,department:document.getElementById('f-dept').value.trim(),
          responsible:document.getElementById('f-resp').value.trim(),
          urgent:document.getElementById('f-urg').value,
          status:document.getElementById('f-sta')?.value||DB.incoming[idx].status,
          note:document.getElementById('f-note').value.trim(),
          file_url:fileUrl||DB.incoming[idx].file_url,
          file_name:fileName||DB.incoming[idx].file_name,
          attach_type:fileUrl?attachType:DB.incoming[idx].attach_type,
          reserved:false,
        };
      }
      addLog('update_incoming',`แก้ไขหนังสือรับ ${DB.incoming.find(d=>d.id===id)?.receive_no}`);
    } else {
      const next=genRunningNo('incoming')||('รบ.'+String(DB.incoming.filter(d=>!d.reserved).length+1).padStart(3,'0')+'/'+(new Date().getFullYear()+543));
      DB.incoming.push({id:genId(),year:DB.activeYear,receive_no:next,reserved:false,
        book_no:document.getElementById('f-bno').value.trim(),
        date_received:displayDate,title,
        department:document.getElementById('f-dept').value.trim(),
        responsible:document.getElementById('f-resp').value.trim(),
        urgent:document.getElementById('f-urg').value,
        status:'รอดำเนินการ',
        note:document.getElementById('f-note').value.trim(),
        file_url:fileUrl,file_name:fileName,attach_type:fileUrl?attachType:'file'
      });
      addLog('create_incoming',`ลงทะเบียนหนังสือรับ ${next}`);
    }
    dbSave('incoming'); UI.closeModal();
    UI.toast(id?'แก้ไขสำเร็จ':'ลงทะเบียนสำเร็จ','success');
    if(!id){ App._notifyTelegram('incoming', DB.incoming[DB.incoming.length-1]); }
    App._renderIncStats(); App._renderIncTable();
  },
  _changeIncStatus(id){

    if(!doc)return;
    UI.showModal('เปลี่ยนสถานะ',`
      <div class="form-group"><label class="form-label">สถานะปัจจุบัน: ${UI.statusBadge(doc.status)}</label></div>

  async _deleteInc(id){
    const ok=await UI.confirm('ยืนยันการลบ','ต้องการลบหนังสือรับนี้?','🗑️');

  _renderOutTable(){
    const q=App._outSearch.toLowerCase();

  _switchAttachTab(pfx, type){
    const isFile=type==='file';
    document.getElementById(`${pfx}-attach-file-panel`).style.display=isFile?'block':'none';
    document.getElementById(`${pfx}-attach-link-panel`).style.display=isFile?'none':'block';
    document.getElementById(`${pfx}-tab-file`).style.background=isFile?'var(--navy)':'var(--white)';
    document.getElementById(`${pfx}-tab-file`).style.color=isFile?'var(--white)':'var(--text-3)';
    document.getElementById(`${pfx}-tab-link`).style.background=isFile?'var(--white)':'var(--navy)';
    document.getElementById(`${pfx}-tab-link`).style.color=isFile?'var(--text-3)':'var(--white)';
  },
  _onFileSelectedPfx(pfx, inp){
    const f=inp.files[0]; if(!f)return;
    if(f.size>10*1024*1024){UI.toast('ไฟล์ใหญ่เกินไป (สูงสุด 10MB)','error');inp.value='';return;}
    const url=URL.createObjectURL(f);
    document.getElementById(`${pfx}-file-url`).value=url;
    document.getElementById(`${pfx}-file-name`).value=f.name;
    document.getElementById(`${pfx}-file-preview`).innerHTML=`
      <div class="file-preview">
        <i class="fas fa-file-alt file-icon"></i>
        <span class="file-name">${f.name} <span style="color:var(--text-3);font-size:11px">(${(f.size/1024).toFixed(0)} KB)</span></span>
        <button class="file-remove" onclick="App._clearAttachPfx('${pfx}')"><i class="fas fa-times"></i></button>
      </div>`;
  },
  _clearAttachPfx(pfx){
    const inp=document.getElementById(`${pfx}-file`);
    if(inp) inp.value='';
    document.getElementById(`${pfx}-file-url`).value='';
    document.getElementById(`${pfx}-file-name`).value='';
    document.getElementById(`${pfx}-file-preview`).innerHTML='';
  },
  _previewLinkPfx(pfx, val){
    if(!val.trim()){document.getElementById(`${pfx}-link-preview`).innerHTML='';return;}
    let display=val;
    try{const u=new URL(val);display=u.hostname+(u.pathname.length>1?u.pathname:'');}catch(e){}
    document.getElementById(`${pfx}-link-preview`).innerHTML=`
      <div class="file-preview">
        <i class="fas fa-external-link-alt file-icon" style="color:var(--green)"></i>
        <a href="${val}" target="_blank" rel="noopener" class="file-name" style="color:var(--blue)">${display}</a>
      </div>`;
  },
  // Read attach values from form by prefix
  _readAttach(pfx){
    const linkPanel=document.getElementById(`${pfx}-attach-link-panel`);
    const isLink=linkPanel&&linkPanel.style.display!=='none';
    let fileUrl='',fileName='',attachType='file';
    if(isLink){
      fileUrl=(document.getElementById(`${pfx}-link-url`)?.value||'').trim();
      attachType='link';
      if(fileUrl){try{const u=new URL(fileUrl);fileName=u.hostname+(u.pathname.length>1?u.pathname:'');}catch(e){fileName=fileUrl;}}
    } else {
      fileUrl=document.getElementById(`${pfx}-file-url`)?.value||'';
      fileName=document.getElementById(`${pfx}-file-name`)?.value||'';
    }
    return {fileUrl,fileName,attachType};
  },

  // Init drag-and-drop for attach section by prefix
  _initAttachDragDrop(pfx){
    setTimeout(()=>{
      const zone=document.getElementById(`${pfx}-file-drop`);
      if(!zone)return;
      zone.addEventListener('dragover',e=>{e.preventDefault();zone.style.borderColor='var(--navy)';zone.style.background='var(--gray-50)';});
      zone.addEventListener('dragleave',()=>{zone.style.borderColor='';zone.style.background='';});
      zone.addEventListener('drop',e=>{
        e.preventDefault();zone.style.borderColor='';zone.style.background='';
        const f=e.dataTransfer.files[0];
        if(f){const inp=document.getElementById(`${pfx}-file`);const dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;App._onFileSelectedPfx(pfx,inp);}
      });
    },100);
  },

  _saveOut(id){
    const title=document.getElementById('f-ott').value.trim();

    const {fileUrl,fileName,attachType}=App._readAttach('out');
    if(id){
      const idx=DB.outgoing.findIndex(d=>d.id===id);
      if(idx>=0){
        const prev=DB.outgoing[idx];
        DB.outgoing[idx]={...prev,title,to_department:document.getElementById('f-oto').value.trim(),urgent:document.getElementById('f-our').value,signer:document.getElementById('f-osg').value.trim(),status:document.getElementById('f-ost').value,content:document.getElementById('f-ocon').value.trim(),

      }
      addLog('update_outgoing',`แก้ไขหนังสือส่ง ${DB.outgoing.find(d=>d.id===id)?.send_no}`);
    } else {
      const next=genRunningNo('outgoing')||('ส.'+String(DB.outgoing.length+1).padStart(3,'0')+'/'+(new Date().getFullYear()+543));
      const d=new Date();
      DB.outgoing.push({id:genId(),year:DB.activeYear,send_no:next,date_sent:`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`,title,to_department:document.getElementById('f-oto').value.trim(),urgent:document.getElementById('f-our').value,signer:document.getElementById('f-osg').value.trim(),status:document.getElementById('f-ost').value,content:document.getElementById('f-ocon').value.trim(),file_url:fileUrl,file_name:fileName,attach_type:fileUrl?attachType:'file'});

          <button class="btn-icon-act red" onclick="App._deleteOrder('${d.id}')" title="ลบ"><i class="fas fa-trash"></i></button>
        </div></td>`:`<td><button class="btn-icon-act tg" title="แจ้งเตือน Telegram" onclick="App._manualNotify('orders','${d.id}')"><i class="fab fa-telegram-plane"></i></button></td>`}

  _renderOrdersTable(q){
    const el=document.getElementById('orders-table-body');

  _showOrderForm(id){
    const doc=id?DB.orders.find(d=>d.id===id):null;
    const isEdit=!!doc;
    const previewNo=peekNextNo('orders')||`คำสั่งที่ ${String(DB.orders.filter(d=>d.year===DB.activeYear).length+1).padStart(2,'0')}/${DB.activeYear}`;
    UI.showModal(isEdit?'แก้ไขคำสั่ง':'สร้างคำสั่งใหม่',`
      <div class="form-grid">
        <div class="form-group"><label class="form-label">เลขที่คำสั่ง${isEdit?'':' <span style="font-size:11px;color:var(--text-3)">(ว่างไว้ = อัตโนมัติ)</span>'}</label>
          <input class="form-control" id="f-ono" value="${doc?.order_no||''}" placeholder="${isEdit?doc?.order_no||'':previewNo}"></div>
        <div class="form-group"><label class="form-label">วันที่มีผล</label><input type="date" class="form-control" id="f-odt"></div>
        <div class="form-group full"><label class="form-label">เรื่อง <span style="color:var(--red)">*</span></label>
          <input class="form-control" id="f-ott2" value="${doc?.title||''}" placeholder="ระบุเรื่อง"></div>
        ${isEdit?`<div class="form-group"><label class="form-label">สถานะ</label>
          <select class="form-control" id="f-osta">
            ${['มีผลบังคับใช้','ร่าง','ยกเลิก'].map(s=>`<option value="${s}" ${doc?.status===s?'selected':''}>${s}</option>`).join('')}
          </select></div>`:''}
        <div class="form-group full"><label class="form-label">รายละเอียด</label>
          <textarea class="form-control" id="f-ocon2" rows="4">${doc?.content||''}</textarea></div>
        ${App._attachSection('ord', doc)}
      </div>`,`
      <button class="btn btn-outline" onclick="UI.closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="App._saveOrder('${id||''}')"><i class="fas fa-save"></i> ${isEdit?'บันทึก':'สร้างคำสั่ง'}</button>`,
      isEdit?'fa-edit':'fa-clipboard-list');
    App._initAttachDragDrop('ord');
  },
  _saveOrder(id){
    const title=document.getElementById('f-ott2').value.trim();
    if(!title){UI.toast('กรุณาระบุเรื่อง','error');return;}
    const dateVal=document.getElementById('f-odt').value;
    let displayDate='';
    if(dateVal){const p=dateVal.split('-');displayDate=`${p[2]}/${p[1]}/${parseInt(p[0])+543}`;}
    const {fileUrl,fileName,attachType}=App._readAttach('ord');
    if(id){
      const idx=DB.orders.findIndex(d=>d.id===id);
      if(idx>=0){
        const prev=DB.orders[idx];
        DB.orders[idx]={...prev,
          order_no:document.getElementById('f-ono').value.trim()||prev.order_no,
          title,effective_date:displayDate||prev.effective_date,
          status:document.getElementById('f-osta')?.value||prev.status,
          content:document.getElementById('f-ocon2').value.trim(),reserved:false,
          file_url:fileUrl||prev.file_url, file_name:fileName||prev.file_name, attach_type:fileUrl?attachType:prev.attach_type};
      }
      addLog('update_order',`แก้ไขคำสั่ง ${DB.orders.find(d=>d.id===id)?.order_no}`);
    } else {
      const manualNo=document.getElementById('f-ono').value.trim();
      const autoNo=genRunningNo('orders')||`คำสั่งที่ ${String(DB.orders.length+1).padStart(2,'0')}/${new Date().getFullYear()+543}`;
      DB.orders.push({id:genId(),year:DB.activeYear,order_no:manualNo||autoNo,title,effective_date:displayDate,status:'มีผลบังคับใช้',content:document.getElementById('f-ocon2').value.trim(),reserved:false,file_url:fileUrl,file_name:fileName,attach_type:fileUrl?attachType:'file'});
      addLog('create_order','สร้างคำสั่ง: '+title);
    }
    dbSave('orders');
    UI.closeModal(); UI.toast(id?'แก้ไขสำเร็จ':'สร้างคำสั่งสำเร็จ','success');
    if(!id){ App._notifyTelegram('order', DB.orders[DB.orders.length-1]); }
    App._renderOrdersTable('');
  },
  async _deleteOrder(id){
    const ok=await UI.confirm('ยืนยันการลบ','ต้องการลบคำสั่งนี้?','🗑️');
    if(!ok)return;
    DB.orders=DB.orders.filter(d=>d.id!==id);
    dbSave('orders'); addLog('delete_order','ลบคำสั่ง');
    UI.toast('ลบสำเร็จ'); App.renderOrders();
  },

  _numFormatCard(t){
    const f=DB.numberFormats[t.key];
    const buildPreview=(seq)=>previewFormat(f,seq);
    const prev1=buildPreview(f.startNumber||1);
    const prev5=buildPreview((f.startNumber||1)+4);

      <div class="card-header" style="border-left:4px solid ${t.color};padding-left:16px">

        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text-2)">
          <input type="checkbox" id="nf-enabled-${t.key}" ${f.enabled?'checked':''} onchange="App._nfLivePreview('${t.key}')"
            style="width:14px;height:14px;accent-color:var(--navy)"> เปิดใช้
        </label>
      </div>
      <div class="card-body">
        <!-- Live Preview Box -->
        <div style="background:linear-gradient(135deg,var(--navy),var(--navy-light));border-radius:10px;padding:14px 18px;margin-bottom:16px;text-align:center">
          <div style="font-size:10px;color:rgba(255,255,255,.4);margin-bottom:6px;letter-spacing:.08em;text-transform:uppercase">ตัวอย่างเลขที่</div>
          <div id="nf-preview-${t.key}" style="font-family:'Prompt',sans-serif;font-size:24px;font-weight:800;color:var(--gold-light);letter-spacing:.02em">${prev1}</div>
          <div style="font-size:11px;color:rgba(255,255,255,.3);margin-top:5px">ลำดับที่ 5: <span id="nf-preview5-${t.key}" style="color:rgba(255,255,255,.5)">${prev5}</span></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <!-- Prefix -->
          <div class="form-group">
            <label class="form-label" style="font-size:11px">คำนำหน้า (Prefix)</label>
            <input class="form-control" id="nf-prefix-${t.key}" value="${f.prefix||''}" placeholder="เช่น รบ., ที่ ศธ"
              oninput="App._nfLivePreview('${t.key}')" style="font-size:13px">
          </div>
          <!-- Suffix -->
          <div class="form-group">
            <label class="form-label" style="font-size:11px">คำต่อท้ายเลขลำดับ (Suffix)</label>
            <input class="form-control" id="nf-suffix-${t.key}" value="${f.suffix||''}" placeholder="(เว้นว่างได้)"
              oninput="App._nfLivePreview('${t.key}')" style="font-size:13px">
          </div>
          <!-- Separator -->
          <div class="form-group">
            <label class="form-label" style="font-size:11px">ตัวคั่น (Separator)</label>
            <input class="form-control" id="nf-sep-${t.key}" value="${f.separator||'/'}" placeholder="/"
              oninput="App._nfLivePreview('${t.key}')" style="font-size:13px">
          </div>
          <!-- Padding -->
          <div class="form-group">
            <label class="form-label" style="font-size:11px">จำนวนหลักเลขลำดับ</label>
            <select class="form-control" id="nf-pad-${t.key}" onchange="App._nfLivePreview('${t.key}')" style="font-size:13px">
              ${[1,2,3,4,5].map(n=>`<option value="${n}" ${(f.padding||3)===n?'selected':''}>${n===1?'ไม่มีเลขนำหน้า (1, 2, 3...)':n+' หลัก ('+String(1).padStart(n,'0')+')'}</option>`).join('')}
            </select>
          </div>
          <!-- Start number -->
          <div class="form-group">
            <label class="form-label" style="font-size:11px">เลขเริ่มต้น</label>
            <input type="number" class="form-control" id="nf-start-${t.key}" value="${f.startNumber||1}" min="1"
              oninput="App._nfLivePreview('${t.key}')" style="font-size:13px">
          </div>
          <!-- Year type -->
          <div class="form-group">
            <label class="form-label" style="font-size:11px">ประเภทปี</label>
            <select class="form-control" id="nf-ytype-${t.key}" onchange="App._nfLivePreview('${t.key}')" style="font-size:13px">
              <option value="thai" ${(f.yearType||'thai')==='thai'?'selected':''}>พ.ศ. (ไทย)</option>
              <option value="ad" ${f.yearType==='ad'?'selected':''}>ค.ศ. (สากล)</option>
            </select>
          </div>
          <!-- Year digits -->
          <div class="form-group">
            <label class="form-label" style="font-size:11px">รูปแบบปี</label>
            <select class="form-control" id="nf-yfull-${t.key}" onchange="App._nfLivePreview('${t.key}')" style="font-size:13px">
              <option value="0" ${!f.yearFull?'selected':''}>2 หลักท้าย (เช่น 69)</option>
              <option value="1" ${f.yearFull?'selected':''}>4 หลักเต็ม (เช่น 2569)</option>
            </select>
          </div>
          <!-- Checkboxes -->
          <div class="form-group" style="gap:8px">
            <label class="form-label" style="font-size:11px">ตัวเลือกเพิ่มเติม</label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px">
              <input type="checkbox" id="nf-incy-${t.key}" ${f.includeYear!==false?'checked':''} onchange="App._nfLivePreview('${t.key}')"
                style="width:13px;height:13px;accent-color:var(--navy)"> แสดงปีในเลขที่
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;margin-top:4px">
              <input type="checkbox" id="nf-incm-${t.key}" ${f.includeMonth?'checked':''} onchange="App._nfLivePreview('${t.key}')"
                style="width:13px;height:13px;accent-color:var(--navy)"> แสดงเดือนด้วย
            </label>
          </div>
        </div>

        <!-- Quick Presets -->
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--gray-100)">
          <div style="font-size:11px;font-weight:700;color:var(--text-3);margin-bottom:7px;letter-spacing:.05em">⚡ PRESETS</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-sm btn-outline" style="font-size:11px" onclick="App._applyPreset('${t.key}','standard')">มาตรฐาน</button>
            <button class="btn btn-sm btn-outline" style="font-size:11px" onclick="App._applyPreset('${t.key}','ministry')">กระทรวง</button>
            <button class="btn btn-sm btn-outline" style="font-size:11px" onclick="App._applyPreset('${t.key}','simple')">เรียบง่าย</button>
            <button class="btn btn-sm btn-outline" style="font-size:11px" onclick="App._applyPreset('${t.key}','noYear')">ไม่มีปี</button>
            <button class="btn btn-sm btn-outline" style="font-size:11px" onclick="App._applyPreset('${t.key}','withMonth')">มีเดือน</button>

        <!-- Actions -->

          <button class="btn btn-sm btn-primary" onclick="App._saveNumFormat('${t.key}')"><i class="fas fa-save"></i> บันทึกรูปแบบ</button>
        </div>
      </div>
    </div>`;

  _nfLivePreview(type){
    const prefix=document.getElementById(`nf-prefix-${type}`)?.value||'';
    const suffix=document.getElementById(`nf-suffix-${type}`)?.value||'';
    const sep=document.getElementById(`nf-sep-${type}`)?.value||'/';
    const pad=parseInt(document.getElementById(`nf-pad-${type}`)?.value||'3');
    const ytype=document.getElementById(`nf-ytype-${type}`)?.value||'thai';
    const yfull=document.getElementById(`nf-yfull-${type}`)?.value==='1';
    const incy=document.getElementById(`nf-incy-${type}`)?.checked!==false;
    const incm=document.getElementById(`nf-incm-${type}`)?.checked||false;
    const startN=parseInt(document.getElementById(`nf-start-${type}`)?.value||'1')||1;

    const f={prefix,suffix,separator:sep,padding:pad,yearType:ytype,yearFull:yfull,includeYear:incy,includeMonth:incm};
    const p1=document.getElementById(`nf-preview-${type}`);
    const p5=document.getElementById(`nf-preview5-${type}`);
    if(p1) p1.textContent=previewFormat(f, startN);
    if(p5) p5.textContent=previewFormat(f, startN+4);
  },

  _applyPreset(type, preset){
    const labels={incoming:'รบ.',outgoing:'ส.',memos:'บข.',orders:'คำสั่งที่ '};
    const presets={
      standard: {prefix:labels[type]||'',suffix:'',separator:'/',yearType:'thai',yearFull:true,padding:3,includeYear:true,includeMonth:false,startNumber:1},
      ministry: {prefix:{incoming:'ที่ กค ',outgoing:'ที่ ศธ ',memos:'ที่ บค ',orders:'คำสั่งที่ '}[type]||'',suffix:'',separator:'/',yearType:'thai',yearFull:false,padding:4,includeYear:true,includeMonth:false,startNumber:1},
      simple:   {prefix:{incoming:'IN-',outgoing:'OUT-',memos:'M-',orders:'ORD-'}[type]||'',suffix:'',separator:'-',yearType:'ad',yearFull:true,padding:4,includeYear:true,includeMonth:false,startNumber:1},
      noYear:   {prefix:labels[type]||'',suffix:'',separator:'/',yearType:'thai',yearFull:true,padding:3,includeYear:false,includeMonth:false,startNumber:1},
      withMonth:{prefix:labels[type]||'',suffix:'',separator:'/',yearType:'thai',yearFull:true,padding:3,includeYear:true,includeMonth:true,startNumber:1},
    };
    const p=presets[preset]; if(!p)return;
    document.getElementById(`nf-prefix-${type}`).value=p.prefix;
    document.getElementById(`nf-suffix-${type}`).value=p.suffix;
    document.getElementById(`nf-sep-${type}`).value=p.separator;
    document.getElementById(`nf-pad-${type}`).value=p.padding;
    document.getElementById(`nf-ytype-${type}`).value=p.yearType;
    document.getElementById(`nf-yfull-${type}`).value=p.yearFull?'1':'0';
    document.getElementById(`nf-incy-${type}`).checked=p.includeYear;
    document.getElementById(`nf-incm-${type}`).checked=p.includeMonth;
    document.getElementById(`nf-start-${type}`).value=p.startNumber;
    App._nfLivePreview(type);
    UI.toast(`ใช้ preset "${preset}" สำเร็จ`,'info');
  },

  _saveNumFormat(type){
    const f=DB.numberFormats[type];
    const oldStart=f.startNumber;
    f.prefix=document.getElementById(`nf-prefix-${type}`).value;
    f.suffix=document.getElementById(`nf-suffix-${type}`).value||'';
    f.separator=document.getElementById(`nf-sep-${type}`).value;
    f.padding=parseInt(document.getElementById(`nf-pad-${type}`).value||'3');
    f.yearType=document.getElementById(`nf-ytype-${type}`).value;
    f.yearFull=document.getElementById(`nf-yfull-${type}`).value==='1';
    f.includeYear=document.getElementById(`nf-incy-${type}`).checked;
    f.includeMonth=document.getElementById(`nf-incm-${type}`).checked;
    const newStart=parseInt(document.getElementById(`nf-start-${type}`).value||'1')||1;
    f.startNumber=newStart;
    // Reset counter for active year if startNumber changed
    if(newStart!==oldStart) f[`_seq_${DB.activeYear}`]=0;
    f.enabled=document.getElementById(`nf-enabled-${type}`).checked;
    dbSave('numberFormats');
    App._nfLivePreview(type);
    UI.toast(`บันทึกรูปแบบ "${({incoming:'หนังสือรับ',outgoing:'หนังสือส่ง',memos:'บันทึกข้อความ',orders:'คำสั่ง'})[type]}" สำเร็จ`,'success');
    addLog('update_numformat',`แก้ไขรูปแบบเลขสารบรรณ: ${type}`);
  },

  _resetNumFormat(type){
    DB.numberFormats[type]={...NUM_FORMAT_DEFAULTS[type]};
    // clear all year counters
    Object.keys(DB.numberFormats[type]).filter(k=>k.startsWith('_seq_')).forEach(k=>delete DB.numberFormats[type][k]);
    dbSave('numberFormats');
    const types=[
      {key:'incoming',label:'หนังสือรับ',icon:'fa-inbox',color:'var(--blue)'},
      {key:'outgoing',label:'หนังสือส่ง',icon:'fa-paper-plane',color:'var(--green)'},
      {key:'memos',label:'บันทึกข้อความ',icon:'fa-sticky-note',color:'var(--amber)'},
      {key:'orders',label:'คำสั่ง',icon:'fa-clipboard-list',color:'var(--purple)'},
    ];
    const t=types.find(x=>x.key===type);
    const card=document.getElementById(`nfc-${type}`);
    if(card&&t) card.outerHTML=App._numFormatCard(t);
    UI.toast('รีเซ็ตเป็นค่าเริ่มต้นแล้ว','info');
  },

        <div class="stat-card"><div class="stat-icon green"><i class="fas fa-paper-plane"></i></div><div><div class="stat-value">${out.length}</div><div class="stat-label">หนังสือส่ง</div></div></div>
        <div class="stat-card"><div class="stat-icon amber"><i class="fas fa-sticky-note"></i></div><div><div class="stat-value">${mem.length}</div><div class="stat-label">บันทึกข้อความ</div></div></div>
        <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-clipboard-list"></i></div><div><div class="stat-value">${ord.length}</div><div class="stat-label">คำสั่ง</div></div></div>
      </div>

      <div class="dash-grid">
        <div class="card">
          <div class="card-header"><div class="card-title"><i class="fas fa-chart-pie" style="color:var(--blue)"></i> สถานะหนังสือรับ</div></div>
          <div class="card-body">
            ${[['รอดำเนินการ','orange'],['กำลังดำเนินการ','blue'],['ดำเนินการแล้ว','green'],['ส่งต่อแล้ว','navy']].map(([s,c])=>{
              const cnt=inc.filter(x=>x.status===s).length;
