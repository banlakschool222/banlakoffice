  _saveUser(id){
    const fullname=document.getElementById('f-uname').value.trim();
    if(!fullname){UI.toast('กรุณาระบุชื่อ','error');return;}
    if(id){
      const idx=DB.users.findIndex(u=>u.id===id);
      if(idx>=0){
        const pass=document.getElementById('f-upass').value;
        DB.users[idx]={...DB.users[idx],fullname,role:document.getElementById('f-urole').value,department:document.getElementById('f-udept').value.trim(),status:document.getElementById('f-usta')?.value||DB.users[idx].status};
        if(pass) DB.users[idx].password=pass;
      }
    } else {
      const username=document.getElementById('f-uuser').value.trim();
      const password=document.getElementById('f-upass').value;
      if(!username||!password){UI.toast('กรุณากรอกให้ครบ','error');return;}
      if(DB.users.find(u=>u.username===username)){UI.toast('Username นี้ใช้แล้ว','error');return;}
      DB.users.push({id:genId(),username,password,fullname,role:document.getElementById('f-urole').value,department:document.getElementById('f-udept').value.trim(),status:'active'});
    }
    dbSave('users'); UI.closeModal(); UI.toast('บันทึกสำเร็จ'); App._loadUsers();
  },

  _toggleTgTokenVisibility(){
    const inp=document.getElementById('tg-token');
    const eye=document.getElementById('tg-eye');
    if(!inp||!eye)return;
    const isHidden=inp.type==='password';
    inp.type=isHidden?'text':'password';
    eye.innerHTML=`<i class="fas fa-eye${isHidden?'-slash':''}"></i>`;
  },

  _saveTelegramSettings(){
    const token=document.getElementById('tg-token')?.value.trim();
    const chatId=document.getElementById('tg-chatid')?.value.trim();
    if(document.getElementById('tg-enabled')?.checked && (!token||!chatId)){
      UI.toast('กรุณากรอก Bot Token และ Chat ID','error'); return;
    }
    const cfg={
      enabled:document.getElementById('tg-enabled')?.checked||false,
      token, chatId,
      schoolName:document.getElementById('tg-school')?.value.trim()||App.config.schoolName,
      notif_incoming: document.getElementById('notif_incoming')?.checked||false,
      notif_outgoing: document.getElementById('notif_outgoing')?.checked||false,
      notif_memo:     document.getElementById('notif_memo')?.checked||false,
      notif_order:    document.getElementById('notif_order')?.checked||false,
      notif_status:   document.getElementById('notif_status')?.checked||false,
      notif_reserve:  document.getElementById('notif_reserve')?.checked||false,
    };
    App._saveTgConfig(cfg);
    UI.toast('บันทึกการตั้งค่า Telegram สำเร็จ','success');
    addLog('update_telegram','บันทึกการตั้งค่าแจ้งเตือน Telegram');
  },

  async _testTelegram(){
    const btn=document.getElementById('btn-tg-test');
    const res=document.getElementById('tg-test-result');
    const token=document.getElementById('tg-token')?.value.trim();
    const chatId=document.getElementById('tg-chatid')?.value.trim();
    if(!token||!chatId){
      res.innerHTML='<span style="color:var(--red)"><i class="fas fa-times-circle"></i> กรุณากรอก Token และ Chat ID ก่อน</span>';
      return;
    }
    btn.disabled=true; btn.innerHTML='<div class="spinner" style="border-top-color:#229ED9;border-color:rgba(34,158,217,.2)"></div> กำลังส่ง...';
    res.innerHTML='';
    const school=document.getElementById('tg-school')?.value.trim()||App.config.schoolName;
    const msg=`🏫 *${school}*\n✅ ทดสอบระบบแจ้งเตือน Telegram สำเร็จ!\n\n_e-สารบรรณโรงเรียน พร้อมใช้งานแล้ว_`;
    const ok=await App._sendTgMsg(token, chatId, msg);
    btn.disabled=false;
    btn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="#229ED9"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248l-2.04 9.607c-.15.703-.55.875-1.115.545l-3.08-2.27-1.486 1.43c-.165.165-.302.302-.618.302l.22-3.123 5.677-5.127c.247-.22-.054-.341-.384-.121L6.4 14.578l-3.024-.946c-.657-.206-.671-.657.137-.972l11.81-4.555c.547-.198 1.026.133.84.143h-.601z"/></svg> ส่งข้อความทดสอบ`;
    if(ok){
      res.innerHTML='<span style="color:var(--green)"><i class="fas fa-check-circle"></i> ส่งสำเร็จ! ตรวจสอบ Telegram ของคุณ</span>';
    } else {
      res.innerHTML='<span style="color:var(--red)"><i class="fas fa-times-circle"></i> ส่งไม่สำเร็จ ตรวจสอบ Token และ Chat ID อีกครั้ง</span>';
    }
  },

  async _sendTgMsg(token, chatId, text){
    try{
      const resp=await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chat_id:chatId, text, parse_mode:'Markdown', disable_web_page_preview:false})
      });
      const data=await resp.json();
      return data.ok===true;
    }catch(e){ return false; }
  },

  // Build attach line for Telegram message
  _tgAttachLine(docData){
    const url  = docData.file_url  || '';
    const name = docData.file_name || '';
    const type = docData.attach_type || 'file';
    if(!url) return '';
    // blob: URLs are local only — show filename without link
    if(url.startsWith('blob:')){
      return `\n📎 *ไฟล์แนบ:* ${name||'ไฟล์แนบ'} _(ดูได้ในระบบ)_`;
    }
    // Real http URL — show as clickable link
    const icon = type==='link' ? '🔗' : '📎';
    const label = name || url;
    return `\n${icon} *${type==='link'?'ลิงก์แนบ':'ไฟล์แนบ'}:* [${label}](${url})`;
  },

  // Manual Telegram notify — shows preview modal before sending

    const cfg=App._getTgConfig();

      UI.showModal('ตั้งค่า Telegram ก่อน',`

    const attach=App._tgAttachLine(doc);

        `🔖 *สถานะ:* ${doc.status}`,
        `📅 *วันที่รับ:* ${doc.date_received}`,

        attach,``,`_e-สารบรรณโรงเรียน_`
      ],
      memos:[
        `📝 *บันทึกข้อความ*`,`🏫 ${school}`,``,
        `📋 *เลขที่:* ${doc.memo_no||'-'}`,
        `📄 *เรื่อง:* ${doc.title}`,
        `👤 *ถึง:* ${doc.to_person||'-'}`,

        `📆 *ประจำปี:* พ.ศ. ${yr}`,
        attach,``,`_e-สารบรรณโรงเรียน_`
      ],
      orders:[
        `📋 *คำสั่ง*`,`🏫 ${school}`,``,
        `📋 *เลขที่:* ${doc.order_no}`,

        `📅 *วันที่มีผล:* ${doc.effective_date||'-'}`,

        `📆 *ประจำปี:* พ.ศ. ${yr}`,

    };
    const lines=(msgLines[type]||[]).filter(l=>l!==undefined);

      if(/^(📥|📤|📝|📋 \*คำ)/.test(l))
        return `<div style="font-size:15px;font-weight:700;color:var(--navy);margin-bottom:3px">${clean}</div>`;

      if(l.startsWith('_'))
        return `<div style="font-size:11px;color:var(--text-3);font-style:italic;margin-top:4px">${clean}</div>`;
      if(l.startsWith('🔗')||l.startsWith('📎'))
        return `<div style="font-size:12px;color:var(--blue);margin-top:3px">${clean}</div>`;
      return `<div style="font-size:13px;color:var(--text-2);padding:1px 0">${clean}</div>`;

    UI.showModal('ส่งแจ้งเตือนผ่าน Telegram',`

  _pendingTgMsg:'',

  async _doManualNotify(type, id){
    const cfg=App._getTgConfig();
    const btn=document.getElementById('btn-manual-tg-send');
    const res=document.getElementById('manual-tg-result');
    if(!btn||!res) return;
    btn.disabled=true;
    btn.innerHTML='<div class="spinner"></div> กำลังส่ง...';
    const ok=await App._sendTgMsg(cfg.token, cfg.chatId, App._pendingTgMsg);
    if(ok){
      res.innerHTML='<span style="color:var(--green)"><i class="fas fa-check-circle"></i> ส่งสำเร็จ! กรุณาตรวจสอบ Telegram</span>';

      res.innerHTML='<span style="color:var(--red)"><i class="fas fa-times-circle"></i> ส่งไม่สำเร็จ — ตรวจสอบ Token / Chat ID ในตั้งค่า</span>';

  // Called after new doc is created
  async _notifyTelegram(event, docData){
    const cfg=App._getTgConfig();
    if(!cfg.enabled||!cfg.token||!cfg.chatId) return;
    const school=cfg.schoolName||App.config.schoolName;
    const yr=DB.activeYear;
    const attach=App._tgAttachLine(docData);
    let msg='';

    if(event==='incoming' && cfg.notif_incoming){
      msg=`📥 *มีหนังสือรับใหม่*\n🏫 ${school}\n\n`+
          `📋 *เลขรับ:* ${docData.receive_no}\n`+
          `📄 *เรื่อง:* ${docData.title}\n`+
          `🏢 *จาก:* ${docData.department||'-'}\n`+
          `👤 *ผู้รับผิดชอบ:* ${docData.responsible||'-'}\n`+
          `⚡ *ชั้นความเร็ว:* ${docData.urgent||'ปกติ'}\n`+
          `📅 *วันที่รับ:* ${docData.date_received}\n`+
          `📆 *ประจำปี:* พ.ศ. ${yr}`+
          attach+
          `\n\n_แจ้งเตือนจาก e-สารบรรณโรงเรียน_`;
    } else if(event==='outgoing' && cfg.notif_outgoing){
      msg=`📤 *มีหนังสือส่งใหม่*\n🏫 ${school}\n\n`+
          `📋 *เลขที่:* ${docData.send_no}\n`+
          `📄 *เรื่อง:* ${docData.title}\n`+
          `🏢 *ถึง:* ${docData.to_department||'-'}\n`+
          `📆 *ประจำปี:* พ.ศ. ${yr}`+
          attach+
          `\n\n_e-สารบรรณโรงเรียน_`;
    } else if(event==='memo' && cfg.notif_memo){
      msg=`📝 *มีบันทึกข้อความใหม่*\n🏫 ${school}\n\n`+
          `📋 *เลขที่:* ${docData.memo_no||'-'}\n`+
          `📄 *เรื่อง:* ${docData.title}\n`+
          `👤 *ถึง:* ${docData.to_person||'-'}\n`+
          `📆 *ประจำปี:* พ.ศ. ${yr}`+
          attach+
          `\n\n_e-สารบรรณโรงเรียน_`;
    } else if(event==='order' && cfg.notif_order){
      msg=`📋 *มีคำสั่งใหม่*\n🏫 ${school}\n\n`+
          `📋 *เลขที่:* ${docData.order_no}\n`+
          `📄 *เรื่อง:* ${docData.title}\n`+
          `📆 *ประจำปี:* พ.ศ. ${yr}`+
          attach+
          `\n\n_e-สารบรรณโรงเรียน_`;
    } else if(event==='status' && cfg.notif_status){
      msg=`🔄 *เปลี่ยนสถานะเอกสาร*\n🏫 ${school}\n\n`+
          `📋 *เลขที่:* ${docData.no}\n`+
          `📄 *เรื่อง:* ${docData.title}\n`+
          `🔁 *สถานะใหม่:* ${docData.newStatus}\n\n_e-สารบรรณโรงเรียน_`;
    } else if(event==='reserve' && cfg.notif_reserve){
      msg=`🔖 *มีการจองเลขใหม่*\n🏫 ${school}\n\n`+
          `📋 *เลขที่จอง:* ${docData.no}\n`+
          `📄 *เรื่อง:* ${docData.title||'-'}\n`+
          `📆 *ประจำปี:* พ.ศ. ${yr}\n\n_e-สารบรรณโรงเรียน_`;
    }

    if(msg) await App._sendTgMsg(cfg.token, cfg.chatId, msg);
  },
};

            const BACKEND_URL = 'https://script.google.com/macros/s/<b>YOUR_ID</b>/exec';
          </div>
          <div style="margin-top:16px;font-size:12px;color:var(--text-3)">
            📋 ดูวิธี Deploy ใน README.md ที่แนบมาด้วย
          </div>
        </div>
      </div>`;
    return;
  }

  // Verify saved token
  const token = localStorage.getItem('sarabun_token');
  const user  = localStorage.getItem('sarabun_user');
  if (token && user) {
    _gasToken = token;
    try {
      const res = await gasCall('verifyToken');
      if (res.success) {
        App.state.user = res.user;
        localStorage.setItem('sarabun_user', JSON.stringify(res.user));

        // Load number formats from GAS
        const fmtRes = await gasCall('getNumFormats');
        if (fmtRes.success && fmtRes.data) {
          DB.numberFormats = { ...DB.numberFormats, ...fmtRes.data };
        }

        document.getElementById('loading-screen').classList.add('hide');
        setTimeout(() => document.getElementById('loading-screen')?.remove(), 500);
        App.navigate('dashboard');
        return;
      }
    } catch (e) { /* fall through */ }
  }

  // Clear and show login
  localStorage.removeItem('sarabun_token');
  localStorage.removeItem('sarabun_user');
  document.getElementById('loading-screen').classList.add('hide');
  setTimeout(() => document.getElementById('loading-screen')?.remove(), 500);
  App.renderLogin();
});

 '_deleteInc','_deleteOut','_deleteMemo','_deleteOrder',
 '_saveReserve','_saveReserveGeneric'].forEach(fn => {

// ─ Incoming ─
const _origSaveInc = App._saveInc;
App._saveInc = async function(id) {
  const title = document.getElementById('f-ttl')?.value?.trim();
  if (!title) { UI.toast('กรุณาระบุเรื่อง', 'error'); return; }
  const dateVal = document.getElementById('f-drc')?.value || '';
  let displayDate = '';
  if (dateVal) { const p = dateVal.split('-'); displayDate = `${p[2]}/${p[1]}/${parseInt(p[0])+543}`; }
  const { fileUrl, fileName, attachType } = await _readAttachGAS('f');
  const body = {
    book_no: document.getElementById('f-bno')?.value?.trim() || '',
    date_received: displayDate,
    title,
    department: document.getElementById('f-dept')?.value?.trim() || '',
    responsible: document.getElementById('f-resp')?.value?.trim() || '',
    urgent: document.getElementById('f-urg')?.value || 'ปกติ',
    note: document.getElementById('f-note')?.value?.trim() || '',
    file_url: fileUrl, file_name: fileName, attach_type: fileUrl ? attachType : 'file',
  };
  let res;
  if (id) {
    body.id = id; body.status = document.getElementById('f-sta')?.value || undefined;
    res = await gasUpdateIncoming(body);
    if (res.success) { const i = DB.incoming.findIndex(d => d.id === id); if (i >= 0) DB.incoming[i] = { ...DB.incoming[i], ...body }; }
  } else {
    res = await gasCreateIncoming(body);
    if (res.success) App._notifyTelegram('incoming', res.data || {});
  }
  if (res.success) { UI.closeModal(); UI.toast(id ? 'แก้ไขสำเร็จ' : 'ลงทะเบียนสำเร็จ', 'success'); App._renderIncStats(); App._renderIncTable(); }
  else UI.toast(res.error || 'เกิดข้อผิดพลาด', 'error');
};

// ─ Status change ─
const _origChangeIncStatus = App._doChangeIncStatus;
App._doChangeIncStatus = async function(id) {
  const doc = DB.incoming.find(d => d.id === id);
  const ns  = document.getElementById('f-ns')?.value;
  if (!ns) return;
  const res = await gasUpdateIncoming({ id, status: ns });
  if (res.success) {
    if (doc) { doc.status = ns; }
    App._notifyTelegram('status', { no: doc?.receive_no, title: doc?.title, newStatus: ns });
    UI.closeModal(); UI.toast('เปลี่ยนสถานะสำเร็จ');
    App._renderIncStats(); App._renderIncTable();
  } else UI.toast(res.error, 'error');
};

// ─ Reserve ─
App._saveReserve = async function(no) {
  const title = document.getElementById('f-res-ttl')?.value?.trim() || '(จองเลข)';
  const res   = await gasCreateIncoming({ title, reserved: 'true', book_no: '', urgent: 'ปกติ', status: 'รอดำเนินการ', note: '[จองเลข] ' + (document.getElementById('f-res-note')?.value?.trim() || '') });
  if (res.success) {
    App._notifyTelegram('reserve', { no: res.data?.receive_no || no, title });
    UI.closeModal(); UI.toast(`จองเลขสำเร็จ`, 'success');
    App._renderIncStats(); App._renderIncTable();
  } else UI.toast(res.error, 'error');
};
App._saveReserveGeneric = async function(type, no) {
  const title = document.getElementById('f-rv-title')?.value?.trim() || '(จองเลข)';
  const note  = '[จองเลข] ' + (document.getElementById('f-rv-note')?.value?.trim() || '');
  const resp  = document.getElementById('f-rv-resp')?.value?.trim() || '';
  let res;
  if      (type === 'outgoing') res = await gasCreateOutgoing({ title, reserved: 'true', status: 'ร่าง', signer: resp, content: note });
  else if (type === 'memos')    res = await gasCreateMemo({ title, reserved: 'true', status: 'ร่าง', to_person: resp, content: note });
  else if (type === 'orders')   res = await gasCreateOrder({ title, reserved: 'true', status: 'ร่าง', content: note });
  if (res?.success) {
    App._notifyTelegram('reserve', { no: res.data?.send_no || res.data?.memo_no || res.data?.order_no || no, title });
    UI.closeModal(); UI.toast(`จองเลขสำเร็จ`, 'success');
    if (type === 'outgoing') { await gasGetOutgoing(); App._renderOutStats(); App._renderOutTable(); }
    else if (type === 'memos') { await gasGetMemos(); App._renderMemoTable(''); }
    else if (type === 'orders') { await gasGetOrders(); App._renderOrdersTable(''); }
  } else UI.toast(res?.error || 'เกิดข้อผิดพลาด', 'error');
};
